server:
  address: 127.0.0.1
  port: ${COMMERCE_PORT:18080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: commerce-service
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${COMMERCE_DB_URL:jdbc:mysql://127.0.0.1:13306/commerce?characterEncoding=UTF-8&connectionTimeZone=UTC&connectTimeout=2000&socketTimeout=3000}
    username: ${COMMERCE_DB_USER:commerce_writer}
    password: ${COMMERCE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 2000
      validation-timeout: 1000
      initialization-fail-timeout: 1
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    default-statement-timeout: 3

